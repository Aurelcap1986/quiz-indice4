<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    const bonneReponse = 'aurel';
    const app = document.getElementById('app');

    function afficherQuestion() {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-slate-100 p-6">
          <div class="bg-white rounded-3xl shadow-xl p-8 w-full max-w-xl">
            <h1 class="text-3xl font-bold mb-4">Question</h1>
            <p class="mb-4">Qui va rapporter des croissants lundi pro</p>
            <input id="reponse" class="w-full border rounded-xl p-3" placeholder="Votre réponse" />
            <button id="valider" class="w-full mt-4 bg-blue-600 text-white p-3 rounded-xl">
              Valider
            </button>
          </div>
        </div>`;

      const input = document.getElementById('reponse');
      document.getElementById('valider').addEventListener('click', verifier);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') verifier();
      });
      input.focus();
    }

    function verifier() {
      const reponse = document.getElementById('reponse').value;
      if (reponse.trim().toLowerCase() === bonneReponse) {
        afficherIndice();
      } else {
        afficherEchec();
      }
    }

    function afficherIndice() {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-green-50 p-6">
          <div class="bg-white rounded-3xl shadow-xl p-8 max-w-xl text-center">
            <h1 class="text-3xl font-bold text-green-700 mb-4">✅ Bonne réponse !</h1>
            <p class="text-lg">Voici votre indice :</p>
            <p class="mt-4 text-2xl font-semibold">super</p>
          </div>
        </div>`;
    }

    function afficherEchec() {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-red-50 p-6">
          <div class="bg-white rounded-3xl shadow-xl p-8 max-w-xl text-center">
            <h1 class="text-3xl font-bold text-red-700 mb-4">❌ Échec</h1>
            <p class="text-lg">Mauvaise réponse. Vous n'avez pas trouvé la bonne solution.</p>
            <button id="reessayer" class="mt-6 px-4 py-2 bg-blue-600 text-white rounded-xl">
              Réessayer
            </button>
          </div>
        </div>`;
      document.getElementById('reessayer').addEventListener('click', afficherQuestion);
    }

    afficherQuestion();
  </script>
</body>
</html>
